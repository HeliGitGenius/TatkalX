# Nginx config for running WITHOUT Docker (nodes on 127.0.0.1:8001-8003).
# Start:  nginx -c $(pwd)/nginx/nginx.local.conf -p $(pwd)
worker_processes auto;
pid runtime/nginx.pid;
error_log runtime/logs/nginx-error.log warn;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    access_log runtime/logs/nginx-access.log;
    client_body_temp_path runtime/nginx-tmp/body;
    proxy_temp_path runtime/nginx-tmp/proxy;
    fastcgi_temp_path runtime/nginx-tmp/fastcgi;
    uwsgi_temp_path runtime/nginx-tmp/uwsgi;
    scgi_temp_path runtime/nginx-tmp/scgi;

    upstream tatkalx_backend {
        # Round-robin across three independent FastAPI processes.
        # Passive health checks: 1 failure takes a node out of rotation for 5 s.
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;   # Node A
        server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;   # Node B
        server 127.0.0.1:8003 max_fails=1 fail_timeout=5s;   # Node C
        keepalive 64;
    }

    server {
        listen 8080;
        server_name localhost;

        location /api/ {
            include tatkalx_common.inc;
            proxy_pass http://tatkalx_backend;
        }

        # Direct addressing of one node -- used by the dashboard for per-node health and for
        # development-only failure injection. Do not expose in production.
        location /node/a/ { include tatkalx_common.inc; proxy_next_upstream off; proxy_pass http://127.0.0.1:8001/; }
        location /node/b/ { include tatkalx_common.inc; proxy_next_upstream off; proxy_pass http://127.0.0.1:8002/; }
        location /node/c/ { include tatkalx_common.inc; proxy_next_upstream off; proxy_pass http://127.0.0.1:8003/; }

        location /docs { proxy_pass http://tatkalx_backend; }
        location /openapi.json { proxy_pass http://tatkalx_backend; }

        location / {
            root frontend/dist;
            try_files $uri /index.html;
        }
    }
}
