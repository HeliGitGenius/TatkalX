# Nginx config for docker-compose (service names node-a/b/c on port 8000).
worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;

    upstream tatkalx_backend {
        server node-a:8000 max_fails=1 fail_timeout=5s;
        server node-b:8000 max_fails=1 fail_timeout=5s;
        server node-c:8000 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    # Resolve container IPs again after a container restarts.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location /api/ {
            include /etc/nginx/tatkalx_common.inc;
            proxy_pass http://tatkalx_backend;
        }

        location /node/a/ { include /etc/nginx/tatkalx_common.inc; proxy_next_upstream off; set $n http://node-a:8000; rewrite ^/node/a/(.*)$ /$1 break; proxy_pass $n; }
        location /node/b/ { include /etc/nginx/tatkalx_common.inc; proxy_next_upstream off; set $n http://node-b:8000; rewrite ^/node/b/(.*)$ /$1 break; proxy_pass $n; }
        location /node/c/ { include /etc/nginx/tatkalx_common.inc; proxy_next_upstream off; set $n http://node-c:8000; rewrite ^/node/c/(.*)$ /$1 break; proxy_pass $n; }

        location /docs { proxy_pass http://tatkalx_backend; }
        location /openapi.json { proxy_pass http://tatkalx_backend; }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
